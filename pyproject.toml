[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "dysen-ui"
version = "0.1.0"
description = "DYSEN desktop UI and terminal experience"
requires-python = ">=3.12,<3.15"
dependencies = [
    "PySide6>=6.10,<6.11",
    "psutil>=6,<8",
]

[tool.dysen]
entrypoint = "main.py"
